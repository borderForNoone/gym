spring:
  application:
    name: gym-crm
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    change-log: classpath:db/migration/master.xml
    enabled: true

springdoc:
  swagger-ui:
    url: /gia-api.yml
    path: /swagger-ui/index.html
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}