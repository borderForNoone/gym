spring:
  application:
    name: gym-crm
  datasource:
    url: jdbc:mysql://localhost:3306/gym_db
    username: gymuser
    password: gympass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    change-log: classpath:db/migration/master.xml
    enabled: true

app:
  api:
    base-path: /api/v1