spring:
  application:
    name: gym-crm

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  liquibase:
    changelog:
      master: classpath:db/migration/master.xml

  storage:
    data:
      trainees: src/main/resources/data/trainees.csv
      trainers: src/main/resources/data/trainers.csv
      trainings: src/main/resources/data/trainings.csv

server:
  servlet:
    context-path: /gym-crm