db:
  driver: org.h2.Driver
  url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=value

hibernate:
  hbm2ddl:
    auto: validate

  dialect: org.hibernate.dialect.MySQLDialect

liquibase:
  changelog:
    master: classpath:db/test-migration/master.xml

app:
  api:
    base-path: /api/v1